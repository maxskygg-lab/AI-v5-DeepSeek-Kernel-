name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black pyflakes pytest streamlit numpy pandas requests

      - name: Check formatting
        run: black --check --line-length 100 app.py services ui tests eval

      - name: Static check
        run: pyflakes app.py services ui tests eval

      - name: Unit tests
        run: pytest -q
